name: Build plugin
on:
  push:
    paths: ['plugin/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package --file plugin/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: SpectatorCamera-jar
          path: plugin/target/SpectatorCamera-*.jar
      # Publishes the jar on the repo's Releases page so you can download it from your phone
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest plugin/target/SpectatorCamera-*.jar \
            --title "Latest build" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --target "${{ github.sha }}"
